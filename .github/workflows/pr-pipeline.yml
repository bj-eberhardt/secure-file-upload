name: PullRequest with E2E tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build
        id: build
        continue-on-error: true
        run: ./gradlew buildAll --no-daemon

      - name: Upload Micronaut/JUnit test HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micronaut-test-report
          path: backend/build/reports/tests/test/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Micronaut/JUnit test results (XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micronaut-test-results-xml
          path: backend/build/test-results/test/**
          if-no-files-found: warn
          retention-days: 14

      - name: Create Micronaut test summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const runUrl = process.env.RUN_URL || '';

          const xmlDir = path.join('backend', 'build', 'test-results', 'test');
          const htmlDir = path.join('backend', 'build', 'reports', 'tests', 'test');

          function listXmlFiles(dir) {
            try {
              return fs.readdirSync(dir)
                .filter(f => f.endsWith('.xml'))
                .map(f => path.join(dir, f));
            } catch {
              return [];
            }
          }

          function parseCountsFromXml(xml) {
            // Minimal parsing to avoid extra deps. Works for Gradle/JUnit XML.
            const suiteTags = [...xml.matchAll(/<testsuite\\b[^>]*>/g)].map(m => m[0]);
            let tests = 0, failures = 0, errors = 0, skipped = 0;
            for (const tag of suiteTags) {
              const t = Number((tag.match(/\\btests=\"(\\d+)\"/) || [])[1] || 0);
              const f = Number((tag.match(/\\bfailures=\"(\\d+)\"/) || [])[1] || 0);
              const e = Number((tag.match(/\\berrors=\"(\\d+)\"/) || [])[1] || 0);
              const s = Number((tag.match(/\\bskipped=\"(\\d+)\"/) || [])[1] || 0);
              tests += t; failures += f; errors += e; skipped += s;
            }
            return { tests, failures, errors, skipped };
          }

          const xmlFiles = listXmlFiles(xmlDir);
          let total = { tests: 0, failures: 0, errors: 0, skipped: 0 };
          for (const file of xmlFiles) {
            const xml = fs.readFileSync(file, 'utf8');
            const c = parseCountsFromXml(xml);
            total.tests += c.tests;
            total.failures += c.failures;
            total.errors += c.errors;
            total.skipped += c.skipped;
          }

          const reportNote = fs.existsSync(path.join(htmlDir, 'index.html'))
            ? 'Micronaut test HTML report was uploaded as artifact.'
            : 'No HTML test report found.';

          const failed = (total.failures + total.errors) > 0;
          const status = xmlFiles.length === 0
            ? 'No XML results found.'
            : failed ? 'Tests failed.' : 'All tests passed.';

          const summary = [
            `| Result | Count |`,
            `|---|---:|`,
            `| Passed | ${Math.max(0, total.tests - total.failures - total.errors - total.skipped)} |`,
            `| Failed | ${total.failures + total.errors} |`,
            `| Skipped | ${total.skipped} |`,
            `| Total | ${total.tests} |`,
          ].join('\\n');

          const body = `<!-- micronaut-tests-comment -->

          ## Micronaut Tests

          ${status}

          ${reportNote}

          <details>
          <summary>Show results</summary>

          ${summary}

          </details>

          Workflow run: ${runUrl}
          `;

          fs.writeFileSync('micronaut-pr-comment.md', body);
          EOF

      - name: Comment Micronaut test results on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          path: micronaut-pr-comment.md

      - name: Run end to end tests
        id: e2e
        continue-on-error: true
        run: ./gradlew :frontend:npmPlaywrightInstallAll && ./gradlew :frontend:npmE2e

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright test results (json/trace)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/**
          if-no-files-found: warn
          retention-days: 14

      - name: Create Playwright summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const runUrl = process.env.RUN_URL || '';

          let summary = 'No JSON-testresults found.';
          let passed = 0;
          let failed = 0;
          let skipped = 0;
          let flaky = 0;

          if (fs.existsSync('frontend/test-results/.last-run.json')) {
            summary = 'Playwright HTML-report was uploaded as artifact.';
          }

          if (fs.existsSync('frontend/test-results/test-results.json')) {
            const data = JSON.parse(fs.readFileSync('frontend/test-results/test-results.json', 'utf8'));

            function walkSuites(suites = []) {
              for (const suite of suites) {
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    const status = test.status;
                    if (status === 'expected') passed++;
                    else if (status === 'unexpected') failed++;
                    else if (status === 'skipped') skipped++;
                    else if (status === 'flaky') flaky++;
                  }
                }
                walkSuites(suite.suites || []);
              }
            }

            walkSuites(data.suites || []);

            summary = [
              `| Ergebnis | Anzahl |`,
              `|---|---:|`,
              `| ✅ Success | ${passed} |`,
              `| ❌ Failed | ${failed} |`,
              `| ⚠️ Flaky | ${flaky} |`,
              `| ⏭️ Skipped | ${skipped} |`,
            ].join('\n');
          }

          const body = `<!-- playwright-report-comment -->

          ## 🎭 Playwright Test Report

          <details>
          <summary>Show results</summary>

          ${summary}

          </details>

          Workflow run: ${runUrl}

          The full html report can be downloaded at **Artifacts -> playwright-report**.
          `;

          fs.writeFileSync('playwright-pr-comment.md', body);
          EOF

      - name: Comment Playwright results on PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: always() && github.event_name == 'pull_request'
        with:
          path: playwright-pr-comment.md

      - name: Fail job if Playwright failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1

      - name: Fail job if Build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Build docker images
        run: touch .env && docker compose build
