version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/${GITHUB_OWNER:-local}/secure-file-upload:latest
    env_file: .env
    ports:
      - "11433:8080"
    environment:
      - MICRONAUT_ENVIRONMENTS=prod
      - MICRONAUT_SERVER_PORT=8080
      - JAVA_OPTS=${JAVA_OPTS:-"-Xms256m -Xmx768m"}
      - SECURE_UPLOAD_STORAGE_DIR=${SECURE_UPLOAD_STORAGE_DIR:-/data/uploads}
    volumes:
      - uploads:/data/uploads
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  uploads:
